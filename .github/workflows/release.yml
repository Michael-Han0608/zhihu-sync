name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      extension_zip: ${{ steps.package.outputs.EXTENSION_ZIP }}
      source_archive: ${{ steps.package.outputs.SOURCE_ARCHIVE }}
      npm_package: ${{ steps.package.outputs.NPM_PACKAGE }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck CLI
        run: npm run typecheck:cli

      - name: Test
        run: npm test

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${{ steps.version.outputs.VERSION }}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag (v$TAG_VERSION)"
            exit 1
          fi

      - name: Build extension
        run: npm run build

      - name: Package developer preview artifacts
        id: package
        run: |
          set -e
          VERSION="${{ steps.version.outputs.VERSION }}"
          EXTENSION_ZIP="ZhihuSync-extension-v${VERSION}.zip"
          SOURCE_ARCHIVE="ZhihuSync-developer-preview-source-v${VERSION}.tar.gz"

          cd dist
          zip -r "../${EXTENSION_ZIP}" . -x "*.DS_Store"
          cd ..

          NPM_PACKAGE=$(npm pack --ignore-scripts --json | node -e \
            "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s)[0].filename))")

          git archive \
            --format=tar.gz \
            --prefix="zhihu-sync-v${VERSION}/" \
            -o "${SOURCE_ARCHIVE}" \
            "${GITHUB_SHA}"

          sha256sum "${EXTENSION_ZIP}" "${SOURCE_ARCHIVE}" "${NPM_PACKAGE}" > SHA256SUMS

          echo "EXTENSION_ZIP=${EXTENSION_ZIP}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_ARCHIVE=${SOURCE_ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "NPM_PACKAGE=${NPM_PACKAGE}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          set -e
          {
            node scripts/extract-changelog.mjs "${{ steps.version.outputs.VERSION }}" README.md
            printf '\n\n> **Developer Preview：** 自动归档 CLI 已在 macOS 和 Windows + Microsoft Edge + Node.js 22+ 上验证；Linux 自动归档尚未适配。\n'
            printf '\n## Release 附件\n\n'
            printf -- '- `${{ steps.package.outputs.EXTENSION_ZIP }}`：可直接加载的浏览器扩展成品。\n'
            printf -- '- `${{ steps.package.outputs.SOURCE_ARCHIVE }}`：完整自动归档系统源码快照。\n'
            printf -- '- `${{ steps.package.outputs.NPM_PACKAGE }}`：与 npm `next` 渠道相同的安装包。\n'
            printf -- '- `SHA256SUMS`：附件完整性校验。\n'
            printf '\n## 浏览器扩展安装\n\n### Chrome\n'
            printf '1. 下载下方的 `${{ steps.package.outputs.EXTENSION_ZIP }}` 文件\n'
            printf '2. 解压到一个固定位置\n'
            printf '3. 打开 Chrome，访问 `chrome://extensions/`\n'
            printf '4. 右上角开启「开发者模式」\n'
            printf '5. 点击「加载已解压的扩展程序」，选择解压后的文件夹\n'
            printf '\n### Edge\n'
            printf '1. 下载下方的 `${{ steps.package.outputs.EXTENSION_ZIP }}` 文件\n'
            printf '2. 解压到一个固定位置\n'
            printf '3. 打开 Edge，访问 `edge://extensions/`\n'
            printf '4. 左下角开启「开发人员模式」\n'
            printf '5. 点击「加载解压缩的扩展」，选择解压后的文件夹\n'
            printf '\n## 自动归档 CLI（开发者预览）\n\n'
            printf '推荐使用 `npm install --global zhihu-sync@next`；源码包安装说明见 README。\n'
          } > release-body.md
          echo "::group::release-body.md"
          cat release-body.md
          echo "::endgroup::"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            ${{ steps.package.outputs.EXTENSION_ZIP }}
            ${{ steps.package.outputs.SOURCE_ARCHIVE }}
            ${{ steps.package.outputs.NPM_PACKAGE }}
            SHA256SUMS
            release-body.md

  github-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.build.outputs.version }}
          prerelease: true
          body_path: release-body.md
          files: |
            ${{ needs.build.outputs.extension_zip }}
            ${{ needs.build.outputs.source_archive }}
            ${{ needs.build.outputs.npm_package }}
            SHA256SUMS

  publish-npm-preview:
    needs: build
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Publish developer preview to npm
        run: npm publish "${{ needs.build.outputs.npm_package }}" --tag next --provenance
